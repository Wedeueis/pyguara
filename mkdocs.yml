site_name: PyGuara Documentation
theme:
  name: material
  palette:
    primary: indigo
    accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - gen-files:
      scripts:
        - tools/gen_api_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Guides:
      - Onboarding: guides/ONBOARDING.md
      - Zero to Hero Tutorial: guides/zero_to_hero.md
      - Architecture & Style: guides/Archictecture & Style Guide.md
      - Project Structure: guides/PROJECT_STRUCTURE.md
      - Visual Inspection (agents): guides/agent-visual-inspection.md
      - Agent Integration: guides/agent-integration.md
      - Measured Limits: guides/performance.md
      - Testing a Network Path: guides/network-probe.md
  - Core:
      - Architecture: core/architecture.md
      - Entity Component System: core/ecs.md
