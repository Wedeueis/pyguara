name: Release / Deploy

on:
  push:
    tags:
      - 'v*' # Triggers only on tags like v0.2.0, v1.0.0

jobs:
  # One wheel per platform, built by the same workflow every pull request
  # runs. PyGuara's wheel stopped being `py3-none-any` when maturin became
  # the build backend and the Rust accelerator started shipping inside it,
  # so a release can no longer be built on one runner.
  wheels:
    name: Wheels
    uses: ./.github/workflows/wheels.yml

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: wheels
    permissions:
      id-token: write  # IMPORTANT: for trusted publishing

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      # The check the retired hatchling pin used to stand in for: that
      # pin existed because hatchling 1.28 emitted `Metadata-Version: 2.5`
      # and released twine rejects it. maturin emits 2.4, so the
      # workaround went with the backend -- and this asserts that rather
      # than discovering it during an upload.
      - name: Check the metadata
        run: uvx twine check wheels-*/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uvx twine upload wheels-*/*

  docs-deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `make install` builds the extension now, so even the docs job
      # needs a toolchain.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Docs Dependencies
        run: make install

      - name: Configure Git User
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: make docs-deploy
