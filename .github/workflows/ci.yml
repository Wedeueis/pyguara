name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # `gh workflow run ci.yml --ref <branch>` runs the full tier on a branch.
  workflow_dispatch:

# A new push to a pull request makes the run on the old commit worthless.
# Pushes to main are left to finish, so every merge has a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two tiers. Every pull request push runs the fast one: quality, the Linux
  # suite with coverage, the Python store, and Windows, the platform the game
  # ships on first. The full tier adds Python 3.13, macOS and the five wheels,
  # and runs on a push to main, by hand, and on a pull request that touches
  # what those jobs exist to check: the crate, the build, or this pipeline.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The pull request's checkout is its merge commit: parent 1 is the base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -qE '^(rust/|Cargo\.(toml|lock)$|pyproject\.toml$|uv\.lock$|pyguara/native\.py$|\.github/workflows/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$changed"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # maturin is the build backend, so `uv sync` compiles the crate --
      # every job that installs the project needs a toolchain now, and the
      # cache is what keeps that from costing a minute each time.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gilrs, the gamepad backend, links libudev on Linux, and its build
      # script finds it through pkg-config. ALSA needs no headers: it is
      # opened at run time.
      - name: Install udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      - name: Check Formatting
        run: make format-check

      - name: Linting (Ruff)
        run: make lint

      - name: Type Checking (Mypy)
        run: make type-check

  tests:
    name: Tests & Coverage (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Mesa's lavapipe, a software Vulkan driver, so wgpu finds an adapter
      # on a runner with no GPU. Without it every wgpu test skips here and the
      # pixel suites prove nothing in the pipeline -- which is what
      # PYGUARA_REQUIRE_GPU below turns from a silent skip into a failure.
      # udev's headers are for gilrs, as in the quality job.
      - name: Install software Vulkan and udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      # The same argument as PYGUARA_REQUIRE_GPU, for the other half of the
      # engine that skips itself into a green suite. Before maturin was the
      # build backend this pipeline never compiled the crate, so every
      # parity suite -- particles, sparks, the flow field, flocking, the
      # spatial hash -- skipped on every pull request, and the five Track R
      # merges were verified by nothing. `required` is the engine's own
      # mechanism for refusing to run Python by accident.
      - name: Assert the accelerator is present
        run: |
          uv run python -c "
          from pyguara.native import NativeAcceleration, configure, describe
          configure(NativeAcceleration.REQUIRED)
          print(describe())
          "

      # One run of the whole suite, slow tests included.
      # It used to run unit and integration first and then all of it again
      # for coverage: the same tests twice. The floor is in the Makefile.
      - name: Run the tests with coverage
        run: make coverage-check
        env:
          PYGUARA_REQUIRE_GPU: "1"

      - name: Upload Coverage XML
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional: if you use Codecov
          file: ./coverage.xml

  # 3.13 as well as 3.12 because the wheel is `abi3-py312`: one build is
  # claimed to run on both, and a claim nothing exercises is how this
  # repository has been bitten before. Full tier: what breaks it is the
  # crate or the build, which is what puts a pull request in that tier.
  tests-py313:
    name: Tests (py3.13)
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install software Vulkan and udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      - name: Run the tests
        run: uv run pytest -n auto --dist loadgroup -m "not performance" -p no:cacheprovider
        env:
          PYGUARA_REQUIRE_GPU: "1"

  python-fallback:
    name: Python store (no accelerator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gilrs, the gamepad backend, links libudev on Linux, and its build
      # script finds it through pkg-config. ALSA needs no headers: it is
      # opened at run time.
      # A software GPU as well as udev's headers: tests that build a default
      # application open the wgpu renderer, whichever store runs underneath.
      - name: Install software Vulkan and udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      # Now that the wheel ships the extension, native is what everybody
      # runs and the pure-Python implementations are the code at risk of
      # rotting unnoticed. They are not dead code: `PYGUARA_NO_NATIVE=1`
      # is the first thing to try when a bug might be the accelerator's,
      # `native_acceleration = "off"` is a supported setting, and a
      # platform the wheel matrix does not cover falls back to them.
      - name: Run Unit Tests with the accelerator disabled
        run: uv run pytest -n auto --dist loadgroup tests/ -m "not slow and not integration"
        env:
          PYGUARA_NO_NATIVE: "1"
          PYGUARA_REQUIRE_GPU: "1"

  wheels:
    name: Wheels
    needs: scope
    if: needs.scope.outputs.full == 'true'
    uses: ./.github/workflows/wheels.yml


  # The game ships on Windows first, and a path separator, a file lock or a
  # coarse timer passes review on Linux and fails a player there, so Windows
  # runs on every pull request. macOS is the full tier.
  tests-platforms:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.full == 'true' && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Say which store and GPU this runner has
        shell: bash
        run: |
          uv run python -c "
          from pyguara.native import NativeAcceleration, configure, describe
          configure(NativeAcceleration.REQUIRED)
          print(describe())
          from pyguara.native import native_module
          try:
              print('wgpu adapter:', native_module().NativeGpu(8, 8).adapter)
          except RuntimeError as error:
              print('wgpu adapter: none --', error)
          "

      # Both runners have an adapter (Windows: DX12's software Microsoft
      # Basic Render Driver; macOS: Metal on the paravirtual device), so a
      # wgpu test that skips here is a failure, as on Linux.
      - name: Run the tests
        shell: bash
        run: uv run pytest -n auto --dist loadgroup -m "not performance and not slow" -p no:cacheprovider
        env:
          PYGUARA_REQUIRE_GPU: "1"

      # Windows is the main platform for networked games. The suite above
      # covers the transport; this reports, rather than asserts, a real
      # socket on loopback: on Linux it reads about 7 ms, and coarse
      # Windows timers would show here as a much higher figure.
      - name: Measure a real socket on loopback
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run python tools/net_probe.py host --port 7791 --seconds 8 --wait 60 > host.log 2>&1 &
          for _ in $(seq 60); do
            invite=$(grep -o 'pyguara://[^"]*' host.log || true)
            [ -n "$invite" ] && break
            sleep 1
          done
          uv run python tools/net_probe.py join "$invite" --seconds 8
          wait
          cat host.log
