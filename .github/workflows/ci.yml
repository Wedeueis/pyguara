name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # maturin is the build backend, so `uv sync` compiles the crate --
      # every job that installs the project needs a toolchain now, and the
      # cache is what keeps that from costing a minute each time.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gilrs, the gamepad backend, links libudev on Linux, and its build
      # script finds it through pkg-config. ALSA needs no headers: it is
      # opened at run time.
      - name: Install udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      - name: Check Formatting
        run: make format-check

      - name: Linting (Ruff)
        run: make lint

      - name: Type Checking (Mypy)
        run: make type-check

  tests:
    name: Tests & Coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # 3.13 as well as 3.12 because the wheel is `abi3-py312`: one
        # build is claimed to run on both, and a claim nothing exercises
        # is how this repository has been bitten before. Coverage is
        # gated on 3.12 only, below, so the threshold is one number.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Mesa's lavapipe, a software Vulkan driver, so wgpu finds an adapter
      # on a runner with no GPU. Without it every wgpu test skips here and the
      # pixel suites prove nothing in the pipeline -- which is what
      # PYGUARA_REQUIRE_GPU below turns from a silent skip into a failure.
      # udev's headers are for gilrs, as in the quality job.
      - name: Install software Vulkan and udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      # The same argument as PYGUARA_REQUIRE_GPU, for the other half of the
      # engine that skips itself into a green suite. Before maturin was the
      # build backend this pipeline never compiled the crate, so every
      # parity suite -- particles, sparks, the flow field, flocking, the
      # spatial hash -- skipped on every pull request, and the five Track R
      # merges were verified by nothing. `required` is the engine's own
      # mechanism for refusing to run Python by accident.
      - name: Assert the accelerator is present
        run: |
          uv run python -c "
          from pyguara.native import NativeAcceleration, configure, describe
          configure(NativeAcceleration.REQUIRED)
          print(describe())
          "

      - name: Run Unit Tests
        run: make test-unit
        env:
          PYGUARA_REQUIRE_GPU: "1"

      - name: Run Integration Tests
        run: make test-integration
        env:
          PYGUARA_REQUIRE_GPU: "1"

      # This runs coverage and fails if <85% (as defined in Makefile)
      - name: Check Coverage
        if: matrix.python-version == '3.12'
        run: make coverage-check

      - name: Upload Coverage XML
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional: if you use Codecov
          file: ./coverage.xml

  python-fallback:
    name: Python store (no accelerator)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gilrs, the gamepad backend, links libudev on Linux, and its build
      # script finds it through pkg-config. ALSA needs no headers: it is
      # opened at run time.
      - name: Install udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install Dependencies
        run: make install

      # Now that the wheel ships the extension, native is what everybody
      # runs and the pure-Python implementations are the code at risk of
      # rotting unnoticed. They are not dead code: `PYGUARA_NO_NATIVE=1`
      # is the first thing to try when a bug might be the accelerator's,
      # `native_acceleration = "off"` is a supported setting, and a
      # platform the wheel matrix does not cover falls back to them.
      - name: Run Unit Tests with the accelerator disabled
        run: make test-unit
        env:
          PYGUARA_NO_NATIVE: "1"

  wheels:
    name: Wheels
    needs: quality
    uses: ./.github/workflows/wheels.yml


  # Windows is the main platform for networked games, and every other test job
  # here runs on Ubuntu, so without this the transport only ever compiles there.
  # Sockets are where the platforms differ: an ICMP port-unreachable fails a
  # later `recv_from`, and timers are coarser, which the socket thread relies on.
  network-windows:
    name: Network (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: uv sync --all-extras

      - name: Run the network suites
        run: >-
          uv run pytest tests/test_net_transport.py tests/test_net_hostile.py
          tests/test_net_session.py tests/test_net_replication.py
          tests/test_net_prediction.py tests/integration/test_net_udp.py
          tests/integration/test_net_demo.py

      # Reports, rather than asserts: on Linux this link reads about 7 ms, and
      # coarse Windows timers would show here as a much higher figure.
      - name: Measure a real socket on loopback
        shell: bash
        run: |
          uv run python tools/net_probe.py host --port 7791 --seconds 8 --wait 60 > host.log 2>&1 &
          for _ in $(seq 60); do
            invite=$(grep -o 'pyguara://[^"]*' host.log || true)
            [ -n "$invite" ] && break
            sleep 1
          done
          uv run python tools/net_probe.py join "$invite" --seconds 8
          wait
          cat host.log

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
            version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Verify Build
        run: make build
