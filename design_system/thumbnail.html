<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 168px;overflow:hidden}
.main{background:var(--guara-500);display:grid;place-items:center}
.mark{font-family:var(--font-display);font-size:126px;line-height:1;letter-spacing:.02em;color:#fdecbe;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip span{display:block}<\/style>
<\/head><body>
<div class="main"><div class="mark">PYGUARA<\/div><\/div>
<div class="strip"><span style="background:#fad373"><\/span><span style="background:#9cbc53"><\/span><span style="background:#4c835c"><\/span><span style="background:#5a3576"><\/span><\/div>
<\/body><\/html>
