<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:66px;height:78px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.sw b{font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.04em;display:block}.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.75;display:block}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}img{image-rendering:pixelated;display:block}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><p class="cap">Sprite animation runs at 12 fps; UI transitions never exceed 320ms<\/p>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;font-family:var(--font-mono);font-size:11px">
<div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--dur-instant<\/div><div style="color:var(--text-faint);margin-top:3px">60ms · press feedback<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--dur-fast<\/div><div style="color:var(--text-faint);margin-top:3px">120ms · hover<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--dur-normal<\/div><div style="color:var(--text-faint);margin-top:3px">200ms · panels<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--dur-slow<\/div><div style="color:var(--text-faint);margin-top:3px">320ms · overlays<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--dur-scene<\/div><div style="color:var(--text-faint);margin-top:3px">500ms · scene fade<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--ease-out-back<\/div><div style="color:var(--text-faint);margin-top:3px">overshoot on pickup<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--ease-steps<\/div><div style="color:var(--text-faint);margin-top:3px">steps(4) · sprite ticks<\/div><\/div><div style="border:1px solid var(--edge-subtle);background:var(--surface-card);padding:7px 9px"><div style="color:var(--text-body)">--anim-sprite-fps<\/div><div style="color:var(--text-faint);margin-top:3px">12<\/div><\/div><\/div><\/body><\/html>
