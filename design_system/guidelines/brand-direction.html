<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;height:78px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.sw b{font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.04em;display:block}.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.75;display:block}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><p class="cap">What this world is, and what it is not<\/p><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px;line-height:1.55;text-wrap:pretty"><div><p style="margin:0 0 6px;font-family:var(--font-pixel);font-size:12px;color:var(--state-ok)">Is<\/p><ul style="margin:0;padding-left:18px"><li>Machinery tended, repaired, greened over — still turning because someone maintains it.<\/li><li>Sage and colonial green as the structural neutral; ochre and Guará red as warmth.<\/li><li>Art Nouveau in the <em>line<\/em>: growth follows structure, structure follows growth.<\/li><li>Optimism earned by labour. Work is visible; so is wear.<\/li><\/ul><\/div><div><p style="margin:0 0 6px;font-family:var(--font-pixel);font-size:12px;color:var(--state-danger)">Is not<\/p><ul style="margin:0;padding-left:18px"><li>Rust, corrosion, oxidised metal, a ruined industrial past.<\/li><li>Apocalyptic grey, nihilist dust, nature-versus-industry conflict.<\/li><li>Empty-activism brightness: no slogans, no exclamation marks, no gloss.<\/li><li>Ornament for its own sake — curves must carry structure, never decorate it.<\/li><\/ul><\/div><\/div><\/body><\/html>
