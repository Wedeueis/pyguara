<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:66px;height:78px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.sw b{font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.04em;display:block}.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.75;display:block}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}img{image-rendering:pixelated;display:block}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><p class="cap">Developer overlays are deliberately un-branded and high-signal<\/p><div class="g">
<div class="sw" style="background:#2b2b2b;color:#fff;box-shadow:inset 0 0 0 3px rgba(0,255,0,.588)"><b>collider active<\/b><i>0,255,0 @150<\/i><\/div>
<div class="sw" style="background:#2b2b2b;color:#fff;box-shadow:inset 0 0 0 3px rgba(128,128,128,.588)"><b>sleeping<\/b><i>128,128,128 @150<\/i><\/div>
<div class="sw" style="background:#2b2b2b;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,0,0,.706)"><b>contact<\/b><i>255,0,0 @180<\/i><\/div>
<div class="sw" style="background:var(--dbg-raycast);color:#1b1512"><b>raycast<\/b><i>var(--dbg-raycast)<\/i><\/div><div class="sw" style="background:#00ffff64;color:#1b1512"><b>pathfinding<\/b><i>#00ffff64<\/i><\/div><div class="sw" style="background:var(--dbg-ui-border);color:#f2e2cb"><b>ui-border<\/b><i>var(--dbg-ui-border)<\/i><\/div><div class="sw" style="background:var(--dbg-fps-ok);color:#1b1512"><b>fps ok<\/b><i>var(--dbg-fps-ok)<\/i><\/div><div class="sw" style="background:var(--dbg-fps-bad);color:#f2e2cb"><b>fps bad<\/b><i>var(--dbg-fps-bad)<\/i><\/div><\/div><\/body><\/html>
