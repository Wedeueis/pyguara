# The engine's native accelerator. `pyproject.toml` builds it through
# maturin, so `uv sync`, `uv build` and `pip install` from source all
# compile this crate and the extension ships inside the wheel -- which is
# what makes native the default store rather than something a developer
# builds by hand. See `docs/adr/0003-native-core-spike.md` for why it is
# an accelerator rather than a rewrite, `0004` for the boundary, and
# `0006` for shipping it.
#
# `version` is the crate's own and is not the wheel's: maturin takes that
# from `[project] version` in `pyproject.toml`, so an engine release does
# not have to bump this. The crate is not published to crates.io.
[package]
name = "pyguara_core_rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native acceleration for the PyGuara game engine"
license = "MIT"
repository = "https://github.com/Wedeueis/pyguara"

[lib]
name = "pyguara_core_rs"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
# The RFC pins pyo3 0.23 against edition 2024, which needs rustc >= 1.85 --
# newer than that pyo3 line. Resolved by using a current pyo3 instead; the
# toolchain here is 1.99.
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
