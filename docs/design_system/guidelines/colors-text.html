<div data-theme="light" style="background:var(--surface-card);border:1px solid var(--edge);padding:10px"><p class="cap">Day<\/p>
<div style="font-family:var(--font-pixel);font-size:15px;line-height:1.7"><div style="color:var(--text-heading)">text-heading<\/div><div style="color:var(--text-body)">text-body<\/div><div style="color:var(--text-muted)">text-muted<\/div><div style="color:var(--text-faint)">text-faint<\/div><\/div><\/div><\/div><\/body><\/html>
