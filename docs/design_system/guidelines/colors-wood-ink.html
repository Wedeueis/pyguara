<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:66px;height:78px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.sw b{font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.04em;display:block}.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.75;display:block}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}img{image-rendering:pixelated;display:block}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><p class="cap">Menu plates, bark, and pixel-art outlines — never pure black<\/p><div class="g"><div class="sw" style="background:var(--wood-400);color:#f2e2cb"><b>wood-400<\/b><i>var(--wood-400)<\/i><\/div><div class="sw" style="background:var(--wood-500);color:#f2e2cb"><b>wood-500<\/b><i>var(--wood-500)<\/i><\/div><div class="sw" style="background:var(--wood-600);color:#f2e2cb"><b>wood-600<\/b><i>var(--wood-600)<\/i><\/div><div class="sw" style="background:var(--wood-700);color:#f2e2cb"><b>wood-700<\/b><i>var(--wood-700)<\/i><\/div><div class="sw" style="background:var(--ink-600);color:#f2e2cb"><b>ink-600<\/b><i>var(--ink-600)<\/i><\/div><div class="sw" style="background:var(--ink-700);color:#f2e2cb"><b>ink-700<\/b><i>var(--ink-700)<\/i><\/div><div class="sw" style="background:var(--ink-800);color:#f2e2cb"><b>ink-800<\/b><i>var(--ink-800)<\/i><\/div><div class="sw" style="background:var(--ink-900);color:#f2e2cb"><b>ink-900<\/b><i>var(--ink-900)<\/i><\/div><\/div><\/body><\/html>
