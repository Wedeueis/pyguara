<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:grid;gap:8px}.sw{height:80px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.lab{flex:0 0 auto;height:22px;line-height:22px;background:#161210;padding:0 6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:#f2e6d2;white-space:nowrap}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><p class="cap">Cerrado Dusk is roxo-tinted, not neutral brown — 300/400 are accents, 700/900 are ground<\/p><div class="g" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw" style="background:var(--roxo-300)"><div class="lab">roxo-300<\/div><\/div><div class="sw" style="background:var(--roxo-400)"><div class="lab">roxo-400<\/div><\/div><div class="sw" style="background:var(--roxo-500)"><div class="lab">roxo-500<\/div><\/div><div class="sw" style="background:var(--roxo-600)"><div class="lab">roxo-600<\/div><\/div><div class="sw" style="background:var(--roxo-700)"><div class="lab">roxo-700<\/div><\/div><div class="sw" style="background:var(--roxo-900)"><div class="lab">roxo-900<\/div><\/div><\/div><\/body><\/html>
