<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:14px 16px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:66px;height:78px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.sw b{font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.04em;display:block}.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.75;display:block}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 7px}img{image-rendering:pixelated;display:block}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}<\/style><\/head><body><div class="g" style="gap:22px;padding:6px 0 16px">

<div style="flex:1;background:var(--surface-raised);border:2px solid var(--edge-strong);padding:14px;box-shadow:var(--shadow-stamp-lg)"><div class="cap" style="margin:0">stamp 4px<\/div><\/div>
<div style="flex:1;background:var(--surface-raised);border:1px solid var(--edge);padding:14px;box-shadow:var(--shadow-panel)"><div class="cap" style="margin:0">panel<\/div><\/div>
