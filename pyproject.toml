[build-system]
# Pinned <1.28: hatchling 1.28 emits `Metadata-Version: 2.5`, which the
# released `twine`/`pkginfo` (6.2.0 / 1.12.x) reject, breaking `twine upload`
# in the release workflow. Lift once twine ships 2.5 support.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "pyguara"
version = "0.5.0"
description = "Python game engine featuring a event and data driven archictecture."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Wedeueis Braz", email = "wedeueisbraz@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License"
]
keywords = ["game-engine", "action-rpg", "2d", "event-driven", "data-driven"]
dependencies = [
    "dataclasses-json>=0.6.0",
    "click>=8.1.7",
    "pymunk>=7.2.0",
    "pygame-ce>=2.5.6",
    "pillow>=12.1.0",
    "msgpack>=1.1.2",
    "moderngl>=5.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-benchmark>=4.0.0",
    "syrupy>=4.9.1",  # FIXED: Moved here so it installs correctly

    # Code Quality
    "ruff>=0.14.0",
    "mypy>=1.0.0",

    # Tools
    "pre-commit>=3.0.0",
    "tox>=4.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",

    # Editor (pyguara/editor): Dear ImGui panels over the ModernGL context.
    # A dev extra, not a runtime dependency -- a shipped game never attaches
    # the editor. `tests/test_editor_availability.py` asserts it imports, so
    # it cannot silently go missing the way the old editor's PyOpenGL did.
    "imgui-bundle>=1.92.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "pymdown-extensions>=10.0.0"
]

benchmark = [
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.61.0",
    "py-spy>=0.3.0"
]

build = [
    "pyinstaller>=6.0.0"
]

[project.scripts]
pyguara = "pyguara.cli:main"

[tool.hatch.build]
include = [
    "pyguara/**/*.py",
    "pyguara/**/*.json",
    "pyguara/**/*.md",
    "pyguara/**/*.vert",
    "pyguara/**/*.frag",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    ".git",
    ".pytest_cache",
    "build/",
    "dist/"
]

[tool.hatch.version]
path = "pyguara/__init__.py"

# Testing Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--snapshot-warn-unused"
]
testpaths = ["tests"]
# Exclude deprecated test directories
norecursedirs = [
    "deprecated_tests",
    "__pycache__",
    ".git",
    ".tox",
    "dist",
    "build"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance/benchmark tests",
    "slow: Slow running tests",
    "cli: CLI system tests (command line interface)"
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Matches requires-python (>=3.12). Kept in sync deliberately: while this said
# py39, ruff withheld every modernisation fix and the tree drifted back to
# typing.Dict/Optional style faster than review could catch it.
target-version = "py312"

[tool.ruff.lint]
# E/F  - pycodestyle errors and Pyflakes, the baseline.
# UP   - pyupgrade: keeps annotations on modern syntax now that target-version
#        matches requires-python.
# B    - flake8-bugbear: catches real defects (mutable/call default arguments,
#        raise-without-from, unused loop variables).
# I    - isort: one canonical import order, so import blocks stop churning.
# SIM  - flake8-simplify.
# D    - pydocstyle, under the same `pep257` convention the standalone
#        pydocstyle hook ran with, so this is the same standard enforced by
#        one tool instead of two. It replaced that hook because pydocstyle
#        6.3.0 is unmaintained and cannot parse PEP 695 type parameters --
#        it reported D103 "missing docstring" against docstrings that were
#        plainly present -- and because pre-commit only fed it *changed*
#        files, so 12 D401 violations sat in the tree unreported.
select = ["E4", "E7", "E9", "F", "UP", "B", "I", "SIM", "D"]
ignore = [
    # Nesting often reads better than an `and` chain when the outer condition
    # is a guard and the inner one is the real test; leaving this to judgement.
    "SIM102",
    # A ternary is not automatically clearer than an if/else block.
    "SIM108",
    # An empty method on a non-ABC base is how optional lifecycle hooks are
    # declared here (Scene.on_exit, RenderPass hooks); they are deliberately
    # overridable no-ops, not forgotten abstract methods.
    "B027",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
# The convention the standalone pydocstyle hook enforced (its default), so
# swapping tools kept the standard identical rather than quietly raising it.
# `google` would have been a different, stricter standard -- 190 findings
# against this tree rather than 14.
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Docstring rules cover the engine package only, which is exactly the scope
# the standalone pydocstyle hook had (`files: ^pyguara/.*\.py$`). Selecting
# `D` globally would newly fail 3,429 findings across tests/, games/ and
# tools/ -- widening the standard, which is a separate decision from
# swapping which tool enforces it.
"tests/**" = ["D"]
"games/**" = ["D"]
"tools/**" = ["D"]
"main.py" = ["D"]

# D301 wants `r"""` wherever a docstring contains a backslash. These two
# Click commands must NOT be raw strings: `\b` has to reach Click as a
# backspace, which is its "do not rewrap this paragraph" marker in `--help`.
# Making them raw would send a literal backslash-b and print it. The audit
# changed `r"""` -> `"""` here on purpose, so the rule is wrong for these
# two files specifically rather than for the project.
"pyguara/cli/atlas_generator.py" = ["D301"]
"pyguara/cli/build.py" = ["D301"]

[tool.ruff.lint.flake8-bugbear]
# Vector2 subclasses pymunk.Vec2d, which is a NamedTuple: instances are
# immutable and hashable, so sharing one as a default argument is safe. Without
# this, B008 flags every `scale: Vector2 = Vector2(1, 1)` in the renderer
# protocols and drowns out the one default that is genuinely mutable.
extend-immutable-calls = [
    "pyguara.common.types.Vector2",
    "pyguara.common.types.Vector2.zero",
    "pyguara.common.types.Vector2.one",
    "pyguara.common.types.Vector2.up",
    "pyguara.common.types.Vector2.down",
    "pyguara.common.types.Vector2.left",
    "pyguara.common.types.Vector2.right",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# Type Checking
[tool.mypy]
# Matches requires-python (>=3.12), for the same reason ruff's
# target-version does. While this said 3.10, mypy rejected syntax the
# project is entitled to use -- PEP 695 type parameters parse as a syntax
# error -- so ruff could ask for a modernisation that the type checker then
# refused, and any new generic class was stuck between the two.
python_version = "3.12"
exclude = ["tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymunk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moderngl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PyInstaller.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyguara.game.*"
ignore_missing_imports = true

# Coverage
[tool.coverage.run]
source = ["pyguara"]
omit = [
    "tests/*",
    "pyguara/__main__.py",
    "pyguara/demos/*",
    "*/__pycache__/*",
    "*/deprecated_tests/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

# Tox Configuration
[tool.tox]
legacy_tox_ini = """
[tox]
; requires-python is >=3.12, so every earlier env here was unusable:
; pip refuses to install the package under them.
envlist = py312,lint,type,docs
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
    pytest-mock
commands =
    pytest {posargs}

[testenv:lint]
deps =
    ruff
commands =
    ruff --check pyguara tests

[testenv:type]
deps =
    mypy
    types-pygame
commands =
    mypy pyguara
"""
